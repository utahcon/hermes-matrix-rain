name: matrix-idle-rain
version: 1.1.0
description: "Matrix digital-rain status indicator for CLI sessions. Ambient mode: green rain while the agent works, red rain + text banner when input is required, blue rain when the turn is done — any keypress dismisses. Beacon mode: rain only as a 'your turn' signal. Alternate screen buffer; restores the terminal exactly. No-op for non-TTY sessions (gateway, cron)."
author: Bear Barrett
hooks:
  - post_llm_call
  - pre_llm_call
  - pre_tool_call
  - pre_approval_request
  - post_approval_response
